[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voxgig-sdk-manual-precipitation-stations"
version = "0.0.1"
description = "Unofficial generated Python SDK for the Manual Precipitation Stations public API. Not affiliated with or endorsed by the upstream API provider."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["voxgig", "sdk", "generated-sdk", "openapi", "api-client", "manual-precipitation-stations"]
dependencies = [
    "requests>=2.33",
]

[project.urls]
Homepage = "https://github.com/voxgig-sdk/manual-precipitation-stations-sdk"
Repository = "https://github.com/voxgig-sdk/manual-precipitation-stations-sdk"
Issues = "https://github.com/voxgig-sdk/manual-precipitation-stations-sdk/issues"

# ONE package. core/entity/feature/utility were previously top-level packages;
# those names are real PyPI distributions and common scratch filenames, and
# Python searches the working directory first, so any of them beside the
# caller silently shadowed the SDK's own. They now live inside
# manualprecipitationstations_sdk/ where nothing can reach them.
[tool.setuptools.packages.find]
include = ["manualprecipitationstations_sdk*"]

# Ship the PEP 561 py.typed marker(s) so the inline type hints reach consumers.
[tool.setuptools.package-data]
"*" = ["py.typed"]
